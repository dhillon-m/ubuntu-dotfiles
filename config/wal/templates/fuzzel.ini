[main]
font=Iosevka Nerd Font Propo:size=13
icons-enabled=no
hide-prompt=yes
minimal-lines=yes
terminal=kitty
layer=overlay
fields=name,generic
horizontal-pad=12
exit-on-keyboard-focus-loss=no

[colors]
background={background.strip}ff
text={foreground.strip}ff
match={color2.strip}ff
selection={foreground.strip}ff
selection-text={color0.strip}ff
selection-match={color1.strip}ff
border={foreground.strip}ff

[border]
width=2
radius=2

[dmenu]
exit-immediately-if-empty=yes
