# ── captain-aptos (desktop) ──────────────────────────────────────────────────
# Dual monitor: DP-3 (landscape, primary) + HDMI-A-1 (portrait, rotated 270)

# Displays
    output DP-3     position 1271,405
    output HDMI-A-1 transform 270 position 0,0 scale 0.85
    output DP-3     bg ~/.config/sway/wallpaper_main.jpg fill
    output HDMI-A-1 bg ~/.config/sway/wallpaper_portrait.jpg fill

# Workspace assignments (odd → primary, even → portrait)
    workspace 1  output DP-3
    workspace 3  output DP-3
    workspace 5  output DP-3
    workspace 7  output DP-3
    workspace 9  output DP-3
    workspace 2  output HDMI-A-1
    workspace 4  output HDMI-A-1
    workspace 6  output HDMI-A-1
    workspace 8  output HDMI-A-1
    workspace 10 output HDMI-A-1

# Waybar: main bar on DP-3, secondary bar on HDMI-A-1
    exec_always pkill waybar; true
    exec_always sh -c "sleep 0.1 && \
        waybar --config ~/.cache/wal/waybar-main.jsonc      --style ~/.config/waybar/main/style.css & \
        waybar --config ~/.cache/wal/waybar-secondary.jsonc --style ~/.config/waybar/secondary/style.css"
