# ── deltron-zero (laptop) ────────────────────────────────────────────────────
# Single display: eDP-1 (built-in panel)

# Display
    output eDP-1 position 0,0
    output eDP-1 bg ~/.config/sway/wallpaper_main.jpg fill

# Waybar: single bar on eDP-1 (machine-specific template: all workspaces, Intel GPU)
    exec_always pkill waybar; true
    exec_always sh -c "sleep 0.1 && \
        waybar --config ~/.cache/wal/waybar-main-deltron-zero.jsonc --style ~/.config/waybar/main/style.css"
